name: KONO release checks
# Once per change: on a pull request, and on main after a merge (a push to a PR's branch used to run
# the same checks a second time).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/e2e
          if-no-files-found: ignore
      # What ships in the app must be clean. Build-only tools (vite, eslint) are still audited and
      # reported as a warning, but don't block: an advisory there can come out before any fix exists.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate || echo "::warning::npm audit found issues in build-only tools (see above); the app's own packages are clean"
